services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: revitest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: revitest
    volumes:
      - revitest_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - revitest-net

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: revitest-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/revitest
      CLIENT_URL: http://localhost
      JWT_ACCESS_SECRET: revitest_prod_jwt_access_secret_super_secure_key_2026_xyz!
      JWT_REFRESH_SECRET: revitest_prod_jwt_refresh_secret_ultra_secure_key_2026_abc!
      COOKIE_SECRET: revitest_cookie_signing_prod_secret_key_9999_ultra_secure!
      RATE_LIMIT_MAX: 300
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - revitest-net

  # Frontend Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: revitest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - revitest-net

volumes:
  revitest_mongo_data:
    driver: local

networks:
  revitest-net:
    driver: bridge
