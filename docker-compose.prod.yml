services:
  mongo:
    image: mongo:7.0
    container_name: revitest-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: revitest
    volumes:
      - revitest_mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - revitest-prod-net
    deploy:
      resources:
        limits:
          memory: 1024M

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: revitest-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/revitest
      CLIENT_URL: https://revitest.internal
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-revitest_prod_jwt_access_secret_super_secure_key_2026_xyz!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-revitest_prod_jwt_refresh_secret_ultra_secure_key_2026_abc!}
      COOKIE_SECRET: ${COOKIE_SECRET:-revitest_cookie_signing_prod_secret_key_9999_ultra_secure!}
      RATE_LIMIT_MAX: 500
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - revitest-prod-net
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: revitest-frontend-prod
    restart: always
    networks:
      - revitest-prod-net
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    image: nginx:1.25-alpine
    container_name: revitest-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - revitest-prod-net

volumes:
  revitest_mongo_data_prod:
    driver: local

networks:
  revitest-prod-net:
    driver: bridge
